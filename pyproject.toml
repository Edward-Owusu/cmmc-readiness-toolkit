[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmmc-kit"
version = "0.1.0"
description = "CMMC Level 1 guided self-assessment and draft System Security Plan for small defense suppliers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Edward Owusu"}]
keywords = ["cmmc", "dod", "defense industrial base", "far 52.204-21", "nist 800-171", "ssp", "compliance", "small business"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Intended Audience :: Information Technology",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.37", "pandas>=2.0"]

[project.scripts]
cmmc-check = "cmmc_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cmmc_kit = ["data/*.json"]
